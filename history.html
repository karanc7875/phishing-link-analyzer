<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phishing Link Analyzer | Scan History</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body data-page="history">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand-mark">
            <div class="icon-wrap"><i class="fa-solid fa-shield-halved"></i></div>
            <span>Phishing Link Analyzer</span>
          </div>
        </div>

        <nav class="nav-menu" aria-label="Sidebar navigation">
          <a class="nav-item" href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
          <a class="nav-item" href="scanner.html"><i class="fa-solid fa-magnifying-glass"></i> Scan a Link</a>
          <a class="nav-item" href="history.html"><i class="fa-solid fa-clock-rotate-left"></i> Scan History</a>
          <a class="nav-item" href="dashboard.html#statistics"><i class="fa-solid fa-chart-simple"></i> Security Statistics</a>
          <a class="nav-item" href="profile.html"><i class="fa-solid fa-user-gear"></i> Profile &amp; Settings</a>
        </nav>

        <div class="sidebar-footer">
          <button class="logout-btn" type="button">Logout</button>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <div class="eyebrow">Audit Log</div>
            <h1>Scan History</h1>
          </div>

          <div class="topbar-actions">
            <button class="ghost-btn" type="button" onclick="window.location.href='scanner.html'">Run New Scan</button>
            <div class="profile-chip">
              <div class="avatar">AK</div>
              <div>
                <strong id="topbarUserName">Alex Kumar</strong>
                <small>Security Analyst</small>
              </div>
            </div>
          </div>
        </header>

        <div class="page-header">
          <div>
            <h2 class="page-heading">Recent Analysis Results</h2>
            <p class="page-subtitle">Track suspicious links that were checked and reviewed in your workspace.</p>
          </div>
        </div>

        <div class="card">
          <div class="card-body">
            <div id="scanHistoryList" class="history-list"></div>
          </div>
        </div>
      </main>
    </div>

    <script src="assets/js/app.js"></script>
  </body>
</html>
