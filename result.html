<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phishing Link Analyzer | Result</title>
    <link rel="stylesheet" href="assets/css/styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body data-page="result">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-block">
          <div class="brand-mark">
            <div class="icon-wrap"><i class="fa-solid fa-shield-halved"></i></div>
            <span>Phishing Link Analyzer</span>
          </div>
        </div>

        <nav class="nav-menu" aria-label="Sidebar navigation">
          <a class="nav-item" href="dashboard.html"><i class="fa-solid fa-gauge"></i> Dashboard</a>
          <a class="nav-item" href="scanner.html"><i class="fa-solid fa-magnifying-glass"></i> Scan a Link</a>
          <a class="nav-item" href="history.html"><i class="fa-solid fa-clock-rotate-left"></i> Scan History</a>
          <a class="nav-item" href="dashboard.html#statistics"><i class="fa-solid fa-chart-simple"></i> Security Statistics</a>
          <a class="nav-item" href="profile.html"><i class="fa-solid fa-user-gear"></i> Profile &amp; Settings</a>
        </nav>

        <div class="sidebar-footer">
          <button class="logout-btn" type="button">Logout</button>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div>
            <div class="eyebrow">Scan Result</div>
            <h1>Analysis Details</h1>
          </div>

          <div class="topbar-actions">
            <div class="profile-chip">
              <div class="avatar">AK</div>
              <div>
                <strong id="topbarUserName">Alex Kumar</strong>
                <small>Security Analyst</small>
              </div>
            </div>
          </div>
        </header>

        <div class="page-header">
          <div>
            <h2 class="page-heading">Threat Assessment</h2>
            <p class="page-subtitle">Detailed review of the suspicious link analysis results.</p>
          </div>
        </div>

        <div id="resultViewer" class="result-panel"></div>

        <div class="page-actions" style="margin-top: 22px;">
          <button class="secondary-btn" type="button" onclick="window.location.href='scanner.html'">Scan Another Link</button>
          <button class="ghost-btn" type="button" onclick="window.location.href='history.html'">Back to History</button>
        </div>
      </main>
    </div>

    <script src="assets/js/app.js"></script>
  </body>
</html>
